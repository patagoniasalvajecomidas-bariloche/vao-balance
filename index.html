<style>

.cargando{padding:40px 10px;text-align:center;color:var(--gris)}.spin{width:28px;height:28px;border:3px solid #cfe3d7;border-top-color:var(--verde3);border-radius:50%;animation:g 0.8s linear infinite;margin:0 auto 10px}@keyframes g{to{transform:rotate(360deg)}}
.item{display:flex;align-items:center;gap:10px;padding:12px 0;border-bottom:1px solid #edf1ec}.item .g{flex:1;min-width:0}.item .g b{display:block;font-size:14px;overflow-wrap:anywhere}.item .g small{color:var(--gris);font-size:12px}
.nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:560px;z-index:25;background:#fffffffa;backdrop-filter:blur(10px);border-top:1px solid #e3e9e4;display:flex;justify-content:space-around;padding:8px 4px calc(8px + env(safe-area-inset-bottom))}

.hoja-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}.hoja-top h2{font-size:19px}.x{border:0;background:#eef5ef;border-radius:12px;width:36px;height:36px;font-size:18px}
.resumen{background:var(--claro);border-radius:14px;padding:12px 14px;margin:8px 0 14px}.resumen div{display:flex;justify-content:space-between;gap:10px;padding:4px 0;font-size:13.5px}.resumen div span:first-child{color:var(--gris)}.resumen div span:last-child{font-weight:700;text-align:right;overflow-wrap:anywhere}

.toast.ver{display:block}.t-ok{background:#0f6b45;color:#fff}.t-error{background:#b3261e;color:#fff}.t-warn{background:#fff4d6;color:#6b4500;border:1px solid #e9c66b}.t-info{background:#173f32;color:#fff}
.mes{display:flex;align-items:center;justify-content:space-between;background:#fff;border:1px solid var(--borde);border-radius:14px;padding:6px;margin:10px 0}.mes button{border:0;background:var(--claro);border-radius:10px;width:40px;height:36px;font-size:18px}.mes b{font-size:15px}
.toggle{display:flex;align-items:center;gap:10px;font-size:14px;font-weight:650}.toggle input{width:22px;height:22px}

@media(max-width:360px){main{padding:14px 12px}.grid3{gap:7px}.tile{min-height:92px;padding:10px 4px}.tile .l{font-size:11.5px}.hero .monto{font-size:27px}.acc span:last-child{font-size:11px}}

<body>
<div class="shell">
  <header class="top">
    <div class="logo">VAO</div>
    <div class="marca"><b>VAO BALANCE</b><small id="ver-top"></small></div>
    <button class="pend" id="btn-pend" data-a="ir" data-p="pendientes">⏳ <span id="n-pend">0</span> pendiente</button>
  </header>
  <div class="env">🧪 STAGING · DEMO — datos de prueba, no dinero real</div>
  <main id="app"><div class="cargando"><div class="spin"></div>Cargando…</div></main>
  <nav class="nav" id="nav">
    <button data-tab="inicio" class="on"><span class="i">⌂</span>Inicio</button>
    <button data-tab="historial"><span class="i">≡</span>Historial</button>
    <button data-tab="deudas"><span class="i">⚖</span>Deudas</button>
    <button data-tab="compromisos"><span class="i">🗓</span>Compromisos</button>
    <button data-tab="ajustes"><span class="i">⚙</span>Ajustes</button>
  </nav>
</div>
<div class="velo" id="velo"><div class="hoja" id="hoja" role="dialog" aria-modal="true"></div></div>
<div class="toast" id="toast" role="status"></div>
<script>
'use strict';
// =================================================================
// VAO BALANCE V1 STAGING — frontend
// Sin catálogo, cuentas ni importes escritos acá: todo viene del backend (Google Sheets).
// El acceso llega por un enlace personal (#k=CLAVE&api=URL) y queda guardado en este celular.
// =================================================================
const APP_VERSION = 1;
const PRODUCTO = 'VAO BALANCE V1 STAGING';
const K_ACCESO = 'vb_acceso_v1', K_COLA = 'vb_cola_v1', K_ULT_CTA = 'vb_ult_cuenta_v1';

const $ = s => document.querySelector(s);
const esc = v => String(v == null ? '' : v).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const fmt$ = n => new Intl.NumberFormat('es-AR', { style: 'currency', currency: 'ARS', minimumFractionDigits: 2, maximumFractionDigits: 2 }).format(Number(n) || 0);
const fFecha = s => s && /^\d{4}-\d{2}-\d{2}/.test(s) ? s.slice(8, 10) + '/' + s.slice(5, 7) + '/' + s.slice(0, 4) : (s || '');
const MESES = ['enero', 'febrero', 'marzo', 'abril', 'mayo', 'junio', 'julio', 'agosto', 'septiembre', 'octubre', 'noviembre', 'diciembre'];
const fMes = p => p ? MESES[Number(p.slice(5, 7)) - 1] + ' ' + p.slice(0, 4) : '';
const norm = s => String(s || '').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '').trim();
const ls = {
  get(k, d) { try { const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); return true; } catch (e) { return false; } },
  del(k) { try { localStorage.removeItem(k); } catch (e) {} }
};
function nuevoOpId() {
  const r = (crypto && crypto.randomUUID) ? crypto.randomUUID().replace(/-/g, '') : (Date.now().toString(36) + Math.random().toString(36).slice(2) + Math.random().toString(36).slice(2));
  return 'op-' + r.slice(0, 32);
}
function leerImporte(txt) {
  let s = String(txt || '').trim().replace(/\$|\s/g, '');
  if (!s) return NaN;
  if (s.indexOf(',') !== -1) s = s.replace(/\./g, '').replace(',', '.');
  else if ((s.match(/\./g) || []).length > 1 || /^\d{1,3}\.\d{3}$/.test(s)) s = s.replace(/\./g, '');
  if (!/^\d+(\.\d{1,2})?$/.test(s)) return NaN;
  return Math.round(Number(s) * 100) / 100;
}
const importeTxt = n => (n == null || n === '') ? '' : String(n).replace('.', ',');

// ---------------- Estado ----------------
const S = { acc: null, est: null, error: null, pila: [], hist: { lista: null, filtros: { desde: '', hasta: '', cuenta_id: '', tipo: '', estado: '' } }, compPeriodo: null, compData: null };

// ---------------- Acceso ----------------
function leerAcceso() {
  const h = location.hash || '';
  const m = h.match(/k=([a-f0-9]{64})/), a = h.match(/api=([^&]+)/);
  if (m && a) {
    const api = decodeURIComponent(a[1]);
    if (/^https:\/\/script\.google\.com\/macros\/s\/[^\/]+\/exec$/.test(api)) ls.set(K_ACCESO, { k: m[1], api: api });
    history.replaceState(null, '', location.pathname + location.search);   // borra la clave de la barra de direcciones
  }
  S.acc = ls.get(K_ACCESO, null);
}

// ---------------- API ----------------
async function llamar(accion, datos, opId) {
  if (!S.acc) throw { tipo: 'acceso', mensaje: 'Sin acceso' };
  const ctrl = new AbortController(); const to = setTimeout(() => ctrl.abort(), 35000);
  let resp;
  try {
    resp = await fetch(S.acc.api, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, cache: 'no-store', redirect: 'follow',
      body: JSON.stringify({ accion: accion, clave: S.acc.k, op_id: opId || null, datos: datos || {} }), signal: ctrl.signal });
  } catch (e) { throw { tipo: 'red', mensaje: 'Sin conexión con el servidor' }; }
  finally { clearTimeout(to); }
  if (!resp.ok) throw { tipo: 'red', mensaje: 'El servidor respondió ' + resp.status };
  let j;
  try { j = await resp.json(); } catch (e) { throw { tipo: 'red', mensaje: 'Respuesta no válida del servidor' }; }
  return j;
}

// ---------------- Cola de operaciones (reintentos seguros) ----------------
let cola = ls.get(K_COLA, []);
const colaGuardar = () => { ls.set(K_COLA, cola); pintarPend(); };
const colaQuitar = id => { cola = cola.filter(o => o.op_id !== id); colaGuardar(); };
function pintarPend() {
  const b = $('#btn-pend'); $('#n-pend').textContent = cola.length;
  b.childNodes[2].textContent = cola.length === 1 ? ' pendiente' : ' pendientes';
  b.classList.toggle('ver', cola.length > 0);
}
const ERR_DUDOSOS = ['OCUPADO', 'CLAVE_INVALIDA', 'ERROR_INTERNO'];
async function enviar(accion, datos, etiqueta) {
  const op = { op_id: nuevoOpId(), accion: accion, datos: datos, etiqueta: etiqueta, creado: Date.now(), intentos: 0, ultimoError: '' };
  cola.push(op); colaGuardar();
  return procesar(op, true);
}
async function procesar(op, interactivo) {
  op.intentos++; colaGuardar();
  let j;
  try { j = await llamar(op.accion, op.datos, op.op_id); }
  catch (e) {
    op.ultimoError = e.mensaje || 'sin conexión'; colaGuardar();
    if (interactivo) aviso('⏳ El servidor no confirmó «' + op.etiqueta + '». Quedó PENDIENTE DE VERIFICACIÓN. No lo cargues de nuevo: se reintenta solo y sin duplicar.', 'warn', 8000);
    return { estado: 'pendiente' };
  }
  if (j.ok) {
    colaQuitar(op.op_id);
    if (interactivo) aviso(j.duplicado ? 'ℹ️ Ya estaba guardado. No se duplicó.' : '✅ Guardado: ' + op.etiqueta, j.duplicado ? 'info' : 'ok');
    return { estado: 'ok', j: j };
  }
  if (ERR_DUDOSOS.indexOf(j.error) !== -1) {
    op.ultimoError = j.mensaje; colaGuardar();
    if (interactivo) aviso('⏳ ' + j.mensaje + ' Quedó PENDIENTE: no lo cargues de nuevo.', 'warn', 8000);
    if (j.error === 'CLAVE_INVALIDA') { S.error = j; }
    return { estado: 'pendiente' };
  }
  colaQuitar(op.op_id);
  if (interactivo) aviso('❌ No se guardó: ' + j.mensaje, 'error', 6500);
  return { estado: 'rechazado', j: j };
}
let reintentando = false;
async function reintentarCola() {
  if (reintentando || !cola.length || !S.acc) return;
  reintentando = true; let alguno = false;
  for (const op of cola.slice()) { const r = await procesar(op, false); if (r.estado === 'ok') alguno = true; if (r.estado === 'pendiente') break; }
  reintentando = false;
  if (alguno) { aviso('✅ Se confirmaron operaciones pendientes', 'ok'); await cargarEstado(); }
  else if (pantalla().p === 'pendientes') render();
}

// ---------------- Avisos y hoja inferior ----------------
function aviso(msg, tipo, ms) {
  const t = $('#toast'); t.textContent = msg; t.className = 'toast ver t-' + (tipo || 'info');
  clearTimeout(aviso.tm); aviso.tm = setTimeout(() => t.className = 'toast', ms || 2600);
}
$('#toast').addEventListener('click', () => $('#toast').className = 'toast');
function abrirHoja(titulo, html) {
  $('#hoja').innerHTML = '<div class="hoja-top"><h2>' + esc(titulo) + '</h2><button class="x" data-a="cerrar" aria-label="Cerrar">×</button></div>' + html;
  $('#velo').classList.add('ver');
}
const hojaAbierta = () => $('#velo').classList.contains('ver');
function cerrarHoja() { if (!hojaAbierta()) return; $('#velo').classList.remove('ver'); $('#hoja').innerHTML = ''; }
$('#velo').addEventListener('click', e => { if (e.target.id === 'velo') cerrarHoja(); });

// ---------------- Navegación (botón atrás del celular incluido) ----------------
const pantalla = () => S.pila[S.pila.length - 1] || { p: 'inicio' };
// El historial del navegador tiene siempre una sola "guarda": el botón/gesto Atrás del celular
// hace un paso atrás DENTRO de la app y solo en Inicio pregunta antes de salir.
function guarda() { history.pushState({ vb: 1 }, ''); }
function ir(p, params) { S.pila.push(Object.assign({ p: p }, params || {})); render(); window.scrollTo(0, 0); }
function tab(p) { S.pila = [{ p: 'inicio' }]; if (p !== 'inicio') S.pila.push({ p: p }); render(); window.scrollTo(0, 0); }
function atras() {
  if (hojaAbierta()) { cerrarHoja(); return true; }
  if (S.pila.length > 1) { S.pila.pop(); render(); window.scrollTo(0, 0); return true; }
  return false;
}
window.addEventListener('popstate', () => {
  if (/k=[a-f0-9]{64}/.test(location.hash)) return;   // es el enlace de acceso (lo procesa 'hashchange'), no el botón Atrás
  if (atras()) { guarda(); return; }
  const msg = cola.length ? 'Hay ' + cola.length + ' operación(es) pendiente(s) de verificación. ¿Salir igual de VAO BALANCE?' : '¿Salir de VAO BALANCE?';
  if (confirm(msg)) history.back(); else guarda();
});

async function cargarEstado() {
  try {
    const j = await llamar('estado', {});
    if (!j.ok) { S.error = j; } else { S.est = j; S.error = null; }

const E = () => S.est;

const cat = id => E().categorias.find(c => c.id === id);
const con = id => E().conceptos.find(c => c.id === id);
const porUso = (a, b) => (b.uso - a.uso) || (a.orden - b.orden) || a.nombre.localeCompare(b.nombre, 'es');
const catsTipo = tipo => E().categorias.filter(c => c.activo && c.tipo === tipo).sort(porUso);

// ---------------- Render principal ----------------
function render() {
  $('#ver-top').textContent = 'V1 STAGING · app ' + APP_VERSION + (S.est ? ' · backend ' + S.est.build : '');
  const p = pantalla();
  document.querySelectorAll('#nav button').forEach(b => b.classList.toggle('on', b.dataset.tab === (S.pila[1] ? S.pila[1].p : 'inicio') || (b.dataset.tab === 'inicio' && S.pila.length === 1)));
  const app = $('#app');
  if (!S.acc) { app.innerHTML = vSinAcceso(); return; }
  if (p.p === 'pendientes') { app.innerHTML = vPendientes(); return; }
  if (S.error && S.error.error === 'CLAVE_INVALIDA') { app.innerHTML = vSinAcceso(S.error.mensaje); return; }
  if (!S.est) {
    app.innerHTML = S.error ? '<div class="aviso a-err"><b>No se pudo cargar.</b><br>' + esc(S.error.mensaje) + '</div><button class="btn" data-a="recargar">Reintentar</button>' : '<div class="cargando"><div class="spin"></div>Cargando datos de la planilla…</div>';

  const banner = S.error ? '<div class="aviso a-err">⚠️ ' + esc(S.error.mensaje) + ' · Se muestran los últimos datos cargados. <button class="link" data-a="recargar">Reintentar</button></div>' : '';
  const V = { inicio: vInicio, carga: vCarga, transferir: vTransferir, historial: vHistorial, deudas: vDeudas, deudaNueva: vDeudaNueva, deudaPagar: vDeudaPagar,

  app.innerHTML = banner + (V[p.p] || vInicio)(p) + '<div class="ver-badge">' + esc(PRODUCTO) + ' · app v' + APP_VERSION + ' · backend build ' + esc(E().build) + '</div>';

async function cargarCompromisos() {
  const periodo = S.compPeriodo || E().mes.periodo;
  S.compData = { periodo: periodo, cargando: true };
  try { const j = await llamar('compromisosMes', { periodo: periodo }); S.compData = j.ok ? j : { periodo: periodo, error: j.mensaje }; }
  catch (e) { S.compData = { periodo: periodo, error: e.mensaje }; }
  if (pantalla().p === 'compromisos') render();
}
function filaCompromiso(c, corto) {
  const pill = { PENDIENTE: 'p-warn', PARCIAL: 'p-warn', PAGADO: 'p-ok' }[c.estado];

    '<p class="sub">Son operaciones enviadas sin confirmación del servidor. Se reintentan solas con el mismo identificador, así que <b>no se duplican</b>. No las cargues de nuevo.</p>' +
    (cola.length ? cola.map(o => '<div class="card"><b>' + esc(o.etiqueta) + '</b><div class="sub">Creada ' + new Date(o.creado).toLocaleString('es-AR') + ' · intentos ' + o.intentos + '</div>' + (o.ultimoError ? '<div class="aviso a-warn">' + esc(o.ultimoError) + '</div>' : '') +
      '<div class="fila-btn"><button class="btn chico" data-a="pReintentar" data-id="' + esc(o.op_id) + '">Reintentar</button><button class="btn chico sec2" data-a="pVerificar" data-id="' + esc(o.op_id) + '">Verificar</button><button class="btn chico sec2" data-a="pDescartar" data-id="' + esc(o.op_id) + '">Descartar</button></div></div>').join('')
      : '<div class="vacio" style="margin-top:14px">No hay operaciones pendientes. ✅</div>');
}

// ---------------- Eventos ----------------
document.addEventListener('click', async ev => {
  const t = ev.target.closest('[data-a],[data-tab]');
  if (!t) return;
  if (t.dataset.tab) { cerrarHoja(); tab(t.dataset.tab); return; }
  const d = t.dataset, p = pantalla();
  switch (d.a) {
    case 'cerrar': cerrarHoja(); break;
    case 'atras': atras(); break;
    case 'ir': cerrarHoja(); ir(d.p, { id: d.id, sentido: d.sentido }); break;
    case 'recargar': S.error = null; render(); await cargarEstado(); S.hist.lista = null; if (cola.length) reintentarCola(); break;
    case 'olvidar': if (confirm('¿Cerrar el acceso en este celular? Vas a necesitar el enlace para volver a entrar.' + (cola.length ? '\n\nATENCIÓN: hay ' + cola.length + ' operaciones pendientes que se perderían.' : ''))) { ls.del(K_ACCESO); S.acc = null; S.est = null; render(); } break;
    case 'elegirPerfil': {
      const pf = E().perfiles.find(x => x.id === d.id);
      if (!confirm('¿Usar el perfil «' + pf.nombre + '»? Su catálogo se copia a la planilla de prueba.')) return;
      t.disabled = true; const r = await enviar('elegirPerfil', { perfil_id: d.id }, 'Perfil ' + pf.nombre);
      if (r.estado === 'ok') await cargarEstado(); else t.disabled = false; break;
    }
    case 'carga': ir('carga', { tipo: d.tipo, paso: 'cat' }); break;
    case 'verTodasCat': p.todas = !p.todas; render(); break;
    case 'elegirCat': ir('carga', { tipo: p.tipo, paso: 'con', catId: d.id }); break;
    case 'verTodosCon': p.todos = !p.todos; render(); break;
    case 'elegirCon': ir('carga', { tipo: p.tipo, paso: 'det', catId: p.catId, conId: d.id }); break;
    case 'selCta': document.querySelectorAll('#ctas .tile').forEach(x => x.classList.toggle('sel', x === t)); $('#cta').value = d.id; p.cuenta_id = d.id; break;
    case 'nuevaCat': formCategoria(d.tipo); break;
    case 'nuevoCon': formConcepto(d.id); break;
    case 'conForm': formConcepto(null, d.id); break;
    case 'cuentaForm': formCuenta(d.id); break;
    case 'compForm': formCompromiso(d.id); break;
    case 'registrarMov': {
      if (!S.borrador) return;
      t.disabled = true; t.textContent = 'Registrando…';
      const b = S.borrador; S.borrador = null; ls.set(K_ULT_CTA, b.cuenta_id);
      const datos = { tipo: b.tipo, concepto_id: b.concepto_id, cuenta_id: b.cuenta_id, importe: b.importe, fecha: b.fecha, descripcion: b.descripcion };
      if (b.compromiso_id) { datos.compromiso_id = b.compromiso_id; datos.periodo = b.periodo; }
      const r = await enviar('registrarMovimiento', datos, b.etiqueta);
      cerrarHoja(); await despuesDeGuardar(r, true); break;
    }
    case 'confirmarGenerico': {
      if (!S.pendienteGenerico) return;
      t.disabled = true; t.textContent = 'Registrando…';
      const g = S.pendienteGenerico; S.pendienteGenerico = null;
      const r = await enviar(g.accion, g.datos, g.etiqueta);
      cerrarHoja();
      if (g.despues && (r.estado === 'ok' || r.estado === 'pendiente')) {
        const sentido = g.datos.sentido || (E().deudas.find(x => x.id === g.datos.deuda_id) || {}).sentido || 'DEBO';
        S.pila = [{ p: 'inicio' }, { p: 'deudas', sentido: sentido }];
      }
      await despuesDeGuardar(r, g.volver); break;
    }
    case 'hEstado': S.hist.filtros.estado = d.v; document.querySelectorAll('[data-a=hEstado]').forEach(x => x.classList.toggle('on', x === t)); break;
    case 'hLimpiar': S.hist.filtros = { desde: '', hasta: '', cuenta_id: '', tipo: '', estado: '' }; S.hist.lista = null; render(); break;
    case 'hRecargar': S.hist.lista = null; render(); break;
    case 'verMov': verMov(d.id); break;
    case 'anularMov': {
      const motivo = ($('#mot').value || '').trim();
      if (motivo.length < 3) { aviso('Escribí el motivo de la anulación', 'error'); $('#mot').focus(); return; }
      if (!confirm('¿Anular este movimiento? Va a dejar de contar en los saldos.')) return;
      t.disabled = true; const r = await enviar('anularMovimiento', { id: d.id, motivo: motivo }, 'Anulación de movimiento');
      cerrarHoja(); await despuesDeGuardar(r, false); break;
    }
    case 'dSentido': p.sentido = d.v; render(); break;
    case 'dCerradas': p.verCerradas = !p.verCerradas; render(); break;
    case 'dnSentido': p.sentido = d.v; render(); break;
    case 'anularDeuda': {
      const motivo = prompt('Motivo para anular la deuda:');
      if (motivo === null) return;
      if (motivo.trim().length < 3) { aviso('Escribí un motivo (mínimo 3 letras)', 'error'); return; }
      const r = await enviar('anularDeuda', { id: d.id, motivo: motivo.trim() }, 'Anulación de deuda');
      await despuesDeGuardar(r, false); break;
    }
    case 'pagarComp': {
      const c = E().compromisos.find(x => x.id === d.id), k = con(c.concepto_id);
      if (!k || !k.activo || !cat(k.categoria_id) || !cat(k.categoria_id).activo) { aviso('El concepto de este compromiso está desactivado. Editá el compromiso.', 'error', 5000); return; }
      ir('carga', { tipo: 'EGRESO', paso: 'det', catId: k.categoria_id, conId: k.id, compromiso_id: c.id, compNombre: c.nombre, periodo: d.periodo,
        importe: importeTxt(Math.max((c.importe_estimado || 0) - (((S.compData && S.compData.compromisos) || E().compromisosMes).find(x => x.id === c.id) || { pagado: 0 }).pagado, 0) || ''), cuenta_id: c.cuenta_sugerida_id && cuenta(c.cuenta_sugerida_id) && cuenta(c.cuenta_sugerida_id).activo ? c.cuenta_sugerida_id : undefined });
      break;
    }
    case 'mes': {
      const [y, m] = (S.compPeriodo || E().mes.periodo).split('-').map(Number);
      const dt = new Date(y, m - 1 + Number(d.d), 1);
      S.compPeriodo = dt.getFullYear() + '-' + String(dt.getMonth() + 1).padStart(2, '0'); S.compData = null; render(); break;
    }
    case 'compRecargar': S.compData = null; render(); break;
    case 'pReintentar': { const o = cola.find(x => x.op_id === d.id); if (o) { t.disabled = true; const r = await procesar(o, true); if (r.estado === 'ok') await cargarEstado(); else render(); } break; }
    case 'pVerificar': {
      t.disabled = true;
      try {
        const j = await llamar('verificarOperacion', {}, d.id);
        if (j.ok && j.existe) { colaQuitar(d.id); aviso('✅ Estaba guardada en la planilla. Se quitó de pendientes.', 'ok', 4000); await cargarEstado(); }
        else if (j.ok) aviso('No llegó a la planilla. Podés reintentar (no se duplicará) o descartarla.', 'warn', 6000);
        else aviso('No se pudo verificar: ' + j.mensaje, 'error');
      } catch (e) { aviso('Sin conexión: no se pudo verificar todavía.', 'warn'); }
      render(); break;
    }
    case 'pDescartar': {
      if (!confirm('¿Descartar esta operación? Usalo solo si «Verificar» dijo que NO llegó a la planilla.')) return;
      colaQuitar(d.id); render(); break;
    }
  }
});

async function despuesDeGuardar(r, volverAInicio) {
  if (r.estado === 'ok' || r.estado === 'pendiente') {
    if (volverAInicio) S.pila = [{ p: 'inicio' }];
    S.hist.lista = null; S.compData = null;
  }
  render();
  if (r.estado === 'ok') await cargarEstado();
}

document.addEventListener('input', ev => {
  if (ev.target.id === 'q-con') {
    const p = pantalla(); p.q = ev.target.value;
    const q = norm(p.q), lista = consCat(p.catId);
    const filtrados = q ? lista.filter(x => norm(x.nombre).indexOf(q) !== -1) : (p.todos ? lista : lista.slice(0, TOP()));
    $('#lista-con').innerHTML = tilesConceptos(filtrados, !q, p.catId) + (q && !filtrados.length ? '<div class="vacio" style="grid-column:1/-1">Sin resultados para «' + esc(p.q) + '».</div>' : '');
    const vt = document.querySelector('[data-a=verTodosCon]'); if (vt) vt.style.display = q ? 'none' : '';
  }
  if (ev.target.id === 'imp') {
    const n = leerImporte(ev.target.value);
    $('#imp-ver').textContent = ev.target.value ? (n > 0 ? '= ' + fmt$(n) : 'Importe no válido (máximo 2 decimales)') : 'Escribí el importe';
  }
});

function pedirConfirmacion(titulo, filas, accion, datos, etiqueta, volver) {
  S.pendienteGenerico = { accion: accion, datos: datos, etiqueta: etiqueta, volver: volver };
  abrirHoja(titulo, '<div class="resumen">' + filas.filter(f => f[1] !== '' && f[1] != null).map(f => '<div><span>' + esc(f[0]) + '</span><span>' + esc(f[1]) + '</span></div>').join('') + '</div>' +
    '<button class="btn" data-a="confirmarGenerico">Confirmar y registrar</button><button class="btn sec2" style="margin-top:8px" data-a="cerrar">Corregir</button>');
}

document.addEventListener('submit', async ev => {
  ev.preventDefault();
  const f = ev.target, id = f.id, val = s => ($(s) ? $(s).value : '');
  const btn = f.querySelector('[type=submit]');
  const guardar = async (accion, datos, etiqueta) => { btn.disabled = true; const r = await enviar(accion, datos, etiqueta); btn.disabled = false; return r; };
  if (id === 'f-mov') { confirmarMovimiento(); return; }
  if (id === 'f-tr') {
    const imp = leerImporte(val('#t-i')), o = val('#t-o'), de = val('#t-d');
    if (o === de) { aviso('Elegí dos cuentas distintas', 'error'); return; }
    if (!(imp > 0)) { aviso('Revisá el importe', 'error'); return; }
    pedirConfirmacion('Confirmar transferencia', [['Importe', fmt$(imp)], ['Desde', nombreCta(o)], ['Hacia', nombreCta(de)], ['Fecha', fFecha(val('#t-f'))], ['Detalle', val('#t-x').trim()]],
      'registrarTransferencia', { cuenta_id: o, cuenta_destino_id: de, importe: imp, fecha: val('#t-f'), descripcion: val('#t-x').trim() }, 'Transferencia ' + fmt$(imp), true);
    return;
  }
  if (id === 'f-hist') { S.hist.filtros = Object.assign(S.hist.filtros, { desde: val('#h-d'), hasta: val('#h-h'), cuenta_id: val('#h-c'), tipo: val('#h-t') }); S.hist.lista = null; render(); return; }
  if (id === 'f-deuda') {
    const p = pantalla(), s = p.sentido || 'DEBO', imp = leerImporte(val('#dn-i')), cp = val('#dn-c').trim(), mover = $('#dn-m').checked;
    if (!cp) { aviso('Escribí el nombre', 'error'); return; }
    if (!(imp > 0)) { aviso('Revisá el importe', 'error'); return; }
    if (mover && !val('#dn-cta')) { aviso('Elegí la cuenta', 'error'); return; }
    pedirConfirmacion('Confirmar deuda', [['Tipo', s === 'DEBO' ? 'Debo' : 'Me deben'], ['Con', cp], ['Importe', fmt$(imp)], ['Fecha', fFecha(val('#dn-f'))], ['Vence', fFecha(val('#dn-v'))], ['Descripción', val('#dn-x').trim()],
      ['Dinero', mover ? (s === 'DEBO' ? 'Entra a ' : 'Sale de ') + nombreCta(val('#dn-cta')) : 'No se movió dinero']],
      'crearDeuda', { sentido: s, contraparte: cp, importe: imp, fecha: val('#dn-f'), vencimiento: val('#dn-v'), descripcion: val('#dn-x').trim(), mover_dinero: mover, cuenta_id: mover ? val('#dn-cta') : '' }, 'Deuda ' + cp + ' ' + fmt$(imp), false);
    S.pendienteGenerico.despues = 'deudas';
    return;
  }
  if (id === 'f-pago') {
    const p = pantalla(), dd = E().deudas.find(x => x.id === p.id), imp = leerImporte(val('#pg-i'));
    if (!(imp > 0)) { aviso('Revisá el importe', 'error'); return; }
    if (imp > dd.pendiente) { aviso('El importe supera lo pendiente (' + fmt$(dd.pendiente) + ')', 'error'); return; }
    pedirConfirmacion(dd.sentido === 'DEBO' ? 'Confirmar pago' : 'Confirmar cobro', [['Deuda', dd.contraparte], ['Importe', fmt$(imp)], ['Cuenta', nombreCta(val('#pg-c'))], ['Fecha', fFecha(val('#pg-f'))], ['Queda pendiente', fmt$(Math.round((dd.pendiente - imp) * 100) / 100)]],
      'pagarDeuda', { deuda_id: dd.id, importe: imp, cuenta_id: val('#pg-c'), fecha: val('#pg-f'), descripcion: val('#pg-x').trim() }, (dd.sentido === 'DEBO' ? 'Pago a ' : 'Cobro de ') + dd.contraparte + ' ' + fmt$(imp), false);
    S.pendienteGenerico.despues = 'atras';
    return;
  }
  if (id === 'f-ncat') {
    const r = await guardar('crearCategoria', { nombre: val('#nc-n'), tipo: val('#nc-t'), emoji: val('#nc-e') }, 'Categoría ' + val('#nc-n'));
    if (r.estado === 'ok') { cerrarHoja(); await cargarEstado(); const p = pantalla(); const c = r.j.id ? cat(r.j.id) : null; if (p.p === 'carga' && p.paso === 'cat' && c && c.tipo === p.tipo) ir('carga', { tipo: p.tipo, paso: 'con', catId: c.id }); }
    else if (r.estado === 'pendiente') cerrarHoja();
    return;
  }
  if (id === 'f-con') {
    const editar = f.dataset.id;
    const impTxt = val('#cn-i').trim(), imp = impTxt ? leerImporte(impTxt) : null;
    if (impTxt && !(imp > 0)) { aviso('Importe sugerido no válido', 'error'); return; }
    const datos = editar ? { id: editar, nombre: val('#cn-n'), importe_sugerido: imp, orden: Number(val('#cn-o')), activo: $('#cn-a').checked } : { categoria_id: f.dataset.cat, nombre: val('#cn-n'), importe_sugerido: imp };
    const r = await guardar(editar ? 'editarConcepto' : 'crearConcepto', datos, (editar ? 'Edición de concepto ' : 'Concepto ') + val('#cn-n'));
    if (r.estado === 'ok') {
      cerrarHoja(); await cargarEstado();
      const p = pantalla();
      if (!editar && p.p === 'carga' && p.paso === 'con' && r.j.id && con(r.j.id)) ir('carga', { tipo: p.tipo, paso: 'det', catId: p.catId, conId: r.j.id });
    } else if (r.estado === 'pendiente') cerrarHoja();
    return;
  }
  if (id === 'f-cat') {
    const r = await guardar('editarCategoria', { id: f.dataset.id, nombre: val('#ca-n'), emoji: val('#ca-e'), orden: Number(val('#ca-o')), activo: $('#ca-a').checked }, 'Edición de categoría ' + val('#ca-n'));
    if (r.estado === 'ok') await cargarEstado();
    return;
  }
  if (id === 'f-cta') {
    const editar = f.dataset.id, s = val('#ct-s').trim();
    let saldo = 0;
    if (s) { const neg = s.startsWith('-'); saldo = leerImporte(s.replace(/^-/, '')); if (!(saldo >= 0)) { aviso('Saldo inicial no válido', 'error'); return; } if (neg) saldo = -saldo; }
    const datos = editar ? { id: editar, nombre: val('#ct-n'), tipo: val('#ct-t'), saldo_inicial: saldo, activo: $('#ct-a').checked } : { nombre: val('#ct-n'), tipo: val('#ct-t'), saldo_inicial: saldo };
    const r = await guardar(editar ? 'editarCuenta' : 'crearCuenta', datos, (editar ? 'Edición de cuenta ' : 'Cuenta ') + val('#ct-n'));
    if (r.estado === 'ok') { cerrarHoja(); await cargarEstado(); } else if (r.estado === 'pendiente') cerrarHoja();
    return;
  }
  if (id === 'f-comp') {
    const editar = f.dataset.id, it = val('#cp-i').trim(), imp = it ? leerImporte(it) : null;
    if (it && !(imp > 0)) { aviso('Importe estimado no válido', 'error'); return; }
    if (!val('#cp-k')) { aviso('Elegí un concepto de gasto', 'error'); return; }
    const datos = { nombre: val('#cp-n'), concepto_id: val('#cp-k'), importe_estimado: imp, dia_vencimiento: Number(val('#cp-d')), cuenta_sugerida_id: val('#cp-c') };
    if (editar) { datos.id = editar; datos.activo = $('#cp-a').checked; }
    const r = await guardar(editar ? 'editarCompromiso' : 'crearCompromiso', datos, 'Compromiso ' + val('#cp-n'));
    if (r.estado === 'ok') { cerrarHoja(); S.compData = null; await cargarEstado(); } else if (r.estado === 'pendiente') cerrarHoja();
    return;
  }
});

// ---------------- Arranque ----------------
(async function iniciar() {
  leerAcceso(); pintarPend();
  history.replaceState({ raiz: 1 }, ''); guarda();
  S.pila = [{ p: 'inicio' }];
  render();
  // Si se abre el enlace de acceso con la app ya abierta en la misma pestaña, el navegador no recarga: lo detectamos.
  window.addEventListener('hashchange', async () => {
    if (!/k=[a-f0-9]{64}/.test(location.hash)) return;
    leerAcceso(); guarda(); S.est = null; S.error = null; S.pila = [{ p: 'inicio' }]; render();
    if (S.acc) { await cargarEstado(); if (cola.length) reintentarCola(); }
  });
  if (!S.acc) return;
  await cargarEstado();
  if (cola.length) reintentarCola();
  setInterval(() => { if (cola.length) reintentarCola(); }, 45000);
  window.addEventListener('online', () => { reintentarCola(); if (S.error) cargarEstado(); });
})();
</script>
