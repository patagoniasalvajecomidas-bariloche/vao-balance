  <style>
    :root{font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;color:#18372f;background:#f4f7f5;font-synthesis:none}
    *{box-sizing:border-box}body{margin:0;min-height:100vh}button,input,select,textarea{font:inherit}button{cursor:pointer}button:disabled{opacity:.48;cursor:not-allowed}input,select,textarea{width:100%;padding:13px 14px;border:1px solid #dce6e1;border-radius:13px;background:white;color:#18372f;outline:none}input:focus,textarea:focus,select:focus{border-color:#158669;box-shadow:0 0 0 3px #1586691a}textarea{resize:vertical;min-height:83px}a{color:#006e58}
    .shell{max-width:560px;min-height:100vh;margin:0 auto;background:#f8faf8;box-shadow:0 0 80px #1a3e2d0c;padding-bottom:100px}.topbar{position:sticky;top:0;z-index:9;display:flex;align-items:center;justify-content:space-between;padding:16px 20px 12px;background:#f8faf8ef;backdrop-filter:blur(15px);border-bottom:1px solid #e8eeea}.brand{display:flex;align-items:center;gap:10px}.brand-mark{display:grid;place-items:center;width:34px;height:34px;background:#103c34;color:#d9fce8;border-radius:11px;font-weight:900;letter-spacing:-1px;font-size:17px}.brand strong{font-size:15px;letter-spacing:.7px}.brand small{display:block;color:#688076;font-size:10px;letter-spacing:.5px}.profile-mini{border:1px solid #dce9df;border-radius:30px;background:white;color:#27584b;font-size:12px;padding:8px 10px;max-width:155px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.banner{padding:10px 20px;background:#fff6db;border-bottom:1px solid #efe5c5;color:#775a1e;font-size:11.5px;line-height:1.5}.content{padding:22px 20px}.eyebrow{font-size:11px;letter-spacing:1.1px;font-weight:800;color:#678279;text-transform:uppercase}.page-title{font-size:26px;letter-spacing:-.8px;margin:4px 0 8px;line-height:1.15}.muted{color:#72847b}.sub{font-size:13px;line-height:1.5}.hero{position:relative;overflow:hidden;color:white;background:linear-gradient(122deg,#113d33,#216a51);padding:23px;border-radius:24px;margin-top:22px;box-shadow:0 14px 24px #23674a19}.hero:after{content:'↗';position:absolute;font-weight:bold;right:-8px;top:-60px;color:#ffffff12;font-size:230px}.hero .small{color:#bbdbcc;font-size:12px}.hero .amount{font-size:35px;font-weight:800;letter-spacing:-1.2px;margin:8px 0 23px}.hero-bottom{display:flex;gap:12px;position:relative;z-index:1}.hero-stat{flex:1;padding:9px 10px;background:#ffffff17;border:1px solid #ffffff1a;border-radius:12px}.hero-stat span{display:block;font-size:10px;color:#bbdfcf;margin-bottom:4px}.hero-stat b{font-size:14px}.quickgrid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:9px;margin:20px 0 27px}.quickbtn{border:1px solid #e4ede7;border-radius:17px;padding:14px 5px 12px;background:white;display:flex;flex-direction:column;align-items:center;gap:9px;color:#233e34;box-shadow:0 4px 12px #1b49320b}.quickbtn .qi{font-size:20px;display:grid;place-items:center;width:41px;height:41px;border-radius:14px;background:#ebf5ef}.quickbtn span:last-child{font-size:11px;font-weight:750}.quickbtn:active,.tile:active{transform:scale(.97)}.section-head{display:flex;justify-content:space-between;align-items:center;gap:12px;margin:24px 0 12px}.section-head h2{font-size:17px;margin:0;letter-spacing:-.3px}.textbtn{background:transparent;border:0;color:#146f55;font-size:12px;font-weight:750;padding:8px 0}.account-row{display:grid;grid-template-columns:1fr 1fr;gap:10px}.account{background:white;border:1px solid #e6ece8;border-radius:16px;padding:16px;min-width:0}.account .name{font-size:12px;color:#70877b;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.account .balance{font-weight:800;font-size:18px;letter-spacing:-.5px;margin:7px 0 0}.chips{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0 18px}.chip{padding:8px 12px;border:1px solid #dde8e0;border-radius:28px;background:white;color:#527567;font-weight:650;font-size:12px}.chip.active{background:#164d3d;color:white;border-color:#164d3d}.two-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.three-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:9px}.tile{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;text-align:center;background:white;border:1px solid #e2ebe5;border-radius:17px;min-height:105px;padding:14px 8px;color:#1f4536}.tile .symbol{font-size:26px;line-height:1.1}.tile .tile-label{font-size:12px;line-height:1.2;font-weight:700;overflow-wrap:anywhere}.tile .freq{font-size:10px;color:#899f90}.tile .count{font-size:10px;color:#6a9b7f}.tile.special{border:1.5px dashed #8db8a5;background:#eff8f2;color:#21704f}.tile.selected{border:2px solid #1a8c64;background:#ebf7ef}.two-grid .tile{min-height:107px}.three-grid .tile{min-height:105px}.all-link{width:100%;padding:14px;text-align:center;border:1px solid #dbe7dc;border-radius:15px;background:white;color:#186d51;font-weight:800;font-size:13px;margin-top:10px}.search{position:relative;margin:13px 0}.search input{padding-left:42px}.search:before{content:'⌕';font-size:28px;position:absolute;left:14px;top:4px;color:#6b8376}.step{font-size:12px;color:#6b8575;font-weight:750;margin-bottom:9px}.back{display:inline-flex;align-items:center;gap:7px;border:0;background:transparent;color:#2d6a4f;font-weight:700;padding:0;margin-bottom:18px}.formcard{border:1px solid #e2ebe6;border-radius:21px;background:white;padding:18px;margin-top:16px}.field{margin:0 0 16px}.field label{display:block;font-size:12px;font-weight:800;color:#355e4d;margin:0 0 7px}.field small{font-size:11px;color:#84978b}.bigamount{font-size:26px;font-weight:800}.primary{width:100%;border:0;background:#15583f;color:white;border-radius:15px;padding:15px 18px;font-weight:800;box-shadow:0 5px 14px #236a4423}.secondary{border:1px solid #cfded4;background:white;color:#205640;border-radius:14px;padding:12px 15px;font-weight:750}.warn{background:#fff8e5;border:1px solid #f0e1bb;border-radius:12px;padding:11px;color:#7c642c;font-size:12px;line-height:1.45}.info{background:#edf7f1;border:1px solid #d5eadc;border-radius:12px;padding:13px;color:#306451;font-size:12px;line-height:1.5}.empty{padding:28px 17px;border:1px dashed #cadbce;border-radius:16px;text-align:center;color:#789084;background:white;font-size:13px;line-height:1.6}.mov{display:flex;align-items:center;gap:11px;padding:14px 0;border-bottom:1px solid #edf1ed}.mov .bubble{width:41px;height:41px;border-radius:13px;display:grid;place-items:center;background:#edf5ef;font-size:20px;flex-shrink:0}.mov .detail{flex:1;min-width:0}.mov .detail strong{display:block;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.mov .detail small{font-size:11px;color:#7d9186}.mov .money{font-size:14px;font-weight:850;white-space:nowrap}.positive{color:#0d8b58}.negative{color:#3a5041}.bottom{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:560px;z-index:12;background:#fffefefa;backdrop-filter:blur(10px);padding:10px 10px calc(10px + env(safe-area-inset-bottom));border-top:1px solid #e3e9e4;display:flex;justify-content:space-around}.navbtn{border:0;background:transparent;color:#88998f;font-size:10px;font-weight:700;display:flex;flex-direction:column;gap:4px;align-items:center;min-width:58px}.navbtn .nicon{font-size:22px}.navbtn.active{color:#17684e}.dialog{border:0;padding:0;border-radius:24px;width:min(92%,480px);max-height:85vh;overflow:auto;box-shadow:0 25px 100px #072c2290}.dialog::backdrop{background:#0d2c2399;backdrop-filter:blur(3px)}.modal-inside{padding:23px}.modal-head{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:15px}.modal-head h2{margin:0;font-size:20px}.x{border:0;background:#eef5ef;border-radius:12px;width:34px;height:34px;font-size:18px;color:#2b6047}.profile-option{width:100%;display:flex;align-items:center;gap:14px;text-align:left;padding:15px;margin:10px 0;border:1px solid #dae7dc;border-radius:16px;background:white;color:#1e4331}.profile-option .em{font-size:29px}.profile-option b{display:block;font-size:14px}.profile-option small{display:block;color:#778f7e;margin-top:4px}.listrow{display:flex;align-items:center;gap:12px;border-bottom:1px solid #edf1ec;padding:13px 0}.listrow .grow{flex:1}.mini-btn{border:1px solid #dbe7db;border-radius:10px;background:#fff;color:#287054;padding:7px 10px;font-weight:750;font-size:12px}.pills{display:flex;gap:8px;flex-wrap:wrap}.pills .pill{background:#eaf5ed;color:#37735a;border-radius:30px;font-size:11px;font-weight:750;padding:6px 9px}.note{font-size:11px;color:#809287;line-height:1.6;margin:12px 0}.toast{position:fixed;top:80px;left:50%;transform:translateX(-50%);z-index:80;width:min(90%,460px);background:#173f32;color:white;box-shadow:0 10px 40px #174e3066;padding:13px 17px;border-radius:13px;font-size:13px;display:none}.toast.show{display:block}.period{font-size:12px;color:#607c6a}.focus{font-weight:800;color:#0c684d}.welcome{margin-top:20px;padding:14px;background:#eaf6ec;border-radius:17px;font-size:13px;color:#375d49;line-height:1.5}
    @media(max-width:380px){.content{padding:18px 14px}.topbar{padding:14px}.quickgrid{gap:5px}.quickbtn{padding:10px 2px}.quickbtn span:last-child{font-size:10px}.hero .amount{font-size:31px}.three-grid{gap:7px}.tile{padding:10px 5px;min-height:95px}.tile .tile-label{font-size:11px}}@media(min-width:561px){body{background:#e8eee9;padding:24px 0}.shell{border-radius:20px;overflow:hidden;min-height:calc(100vh - 48px)}.bottom{bottom:0}}
  </style>
</head>
<body>
<div class="shell">
  <header class="topbar"><div class="brand"><div class="brand-mark">VAO</div><div><strong>VAO BALANCE</strong><small>TU DINERO, A TU MANERA</small></div></div><button class="profile-mini" id="profile-switch" title="Cambiar perfil de prueba">Elegir perfil ▾</button></header>
  <div class="banner">🧪 <b>DEMO LOCAL:</b> los datos de prueba quedan únicamente en este navegador. No hay conexión con Google Sheets ni dinero real.</div>
  <main class="content" id="app" aria-live="polite"></main>
  <nav class="bottom" aria-label="Navegación principal"><button class="navbtn active" data-nav="inicio"><span class="nicon">⌂</span>Inicio</button><button class="navbtn" data-nav="movimientos"><span class="nicon">≡</span>Historial</button><button class="navbtn" data-nav="catalogo"><span class="nicon">▦</span>Catálogo</button><button class="navbtn" data-nav="ajustes"><span class="nicon">⚙</span>Ajustes</button></nav>
</div>
<dialog class="dialog" id="modal"><div class="modal-inside" id="modal-body"></div></dialog>
<div class="toast" id="toast" role="status"></div>
<script src="catalogo.js"></script>
<script>
'use strict';
const $ = s => document.querySelector(s);
const $$ = s => Array.from(document.querySelectorAll(s));
const html = v => String(v ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const money = n => new Intl.NumberFormat('es-AR',{style:'currency',currency:'ARS',maximumFractionDigits:2}).format(Number(n)||0);
const today = () => {const d=new Date(); return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;};
const uid = () => (crypto && crypto.randomUUID ? crypto.randomUUID() : 'op-'+Date.now()+'-'+Math.random().toString(36).slice(2));
const CAT = window.VAO_CATALOGO;
const app = $('#app');const modal = $('#modal');let store,perfil;
let page='inicio',flow=null,showAll=false,searchTerm='',catalogSearch='',movFilter='TODOS',showAllCategories=false;
const storageKey = id => 'vao_balance_demo_v1_'+id;
function readProfile(id){
  const p=CAT.perfiles.find(x=>x.id===id);if(!p) return null;
  let saved=null;try{saved=JSON.parse(localStorage.getItem(storageKey(id)));}catch{}
  return saved && Array.isArray(saved.categorias) && Array.isArray(saved.movimientos) ? saved : {categorias:structuredClone(p.categorias),conceptos:structuredClone(p.conceptos),cuentas:structuredClone(p.cuentas),movimientos:[]};
}
function persist(){localStorage.setItem(storageKey(perfil.id),JSON.stringify(store));}
function setProfile(id){let p=CAT.perfiles.find(p=>p.id===id);if(!p)return;perfil=p;store=readProfile(id);localStorage.setItem('vao_balance_demo_profile',id);flow=null;page='inicio';hideModal();render();}
function openModal(markup){$('#modal-body').innerHTML=markup;modal.showModal();}
function hideModal(){if(modal.open)modal.close();}
function modalTitle(title){return `<div class="modal-head"><h2>${title}</h2><button class="x" data-action="close-modal" aria-label="Cerrar">×</button></div>`;}
function chooseProfile(){openModal(modalTitle('¿Cómo vas a usarlo?')+`<p class="sub muted">Elegí un perfil de ejemplo. Cada uno tiene su catálogo y datos de prueba separados.</p>`+CAT.perfiles.map(p=>`<button class="profile-option" data-action="select-profile" data-id="${html(p.id)}"><span class="em">${html(p.emoji)}</span><span><b>${html(p.nombre)}</b><small>${html(p.descripcion)}</small></span><span style="margin-left:auto">→</span></button>`).join('')+`<p class="note">Podés cambiarlo cuando quieras. El perfil no limita las funciones.</p>`);}
function nav(p){flow=null;page=p;render();window.scrollTo({top:0,behavior:'instant'});}
function getCats(tipo){return store.categorias.filter(c=>c.tipo===tipo && c.activo!==false).sort((a,b)=>(a.orden??99)-(b.orden??99));}
function getConcepts(cid){return store.conceptos.filter(c=>c.categoriaId===cid && c.activo!==false);}
function category(cid){return store.categorias.find(c=>c.id===cid);}
function concept(id){return store.conceptos.find(c=>c.id===id);}
function account(id){return store.cuentas.find(c=>c.id===id);}
function frequency(cid){return store.movimientos.filter(m=>m.estado==='ACTIVO' && m.conceptoId===cid).length;}
function rankedConcepts(cid){return getConcepts(cid).sort((a,b)=>frequency(b.id)-frequency(a.id)||a.orden-b.orden);}
function categoryFrequency(cid){return store.movimientos.filter(m=>m.estado==='ACTIVO' && m.categoriaId===cid).length;}
function rankedCats(tipo){return getCats(tipo).sort((a,b)=>categoryFrequency(b.id)-categoryFrequency(a.id)||a.orden-b.orden);}
function saldoCuenta(cid){const c=account(cid);if(!c)return 0;let value=Number(c.saldoInicial)||0;for(const m of store.movimientos){if(m.estado!=='ACTIVO')continue;if(m.tipo==='INGRESO'&&m.cuentaId===cid)value+=m.importe;else if(m.tipo==='GASTO'&&m.cuentaId===cid)value-=m.importe;else if(m.tipo==='TRANSFERENCIA'){if(m.cuentaId===cid)value-=m.importe;if(m.destinoId===cid)value+=m.importe;}}return value;}
function totalesMes(){const mes=today().slice(0,7);const mm=store.movimientos.filter(m=>m.estado==='ACTIVO'&&m.fecha.slice(0,7)===mes);return {ing: mm.filter(m=>m.tipo==='INGRESO').reduce((s,m)=>s+m.importe,0),gas:mm.filter(m=>m.tipo==='GASTO').reduce((s,m)=>s+m.importe,0)};}
function flowStart(tipo){flow={tipo,etapa:'categoria',categoriaId:null,conceptoId:null};page='carga';showAll=false;searchTerm='';render();window.scrollTo({top:0,behavior:'instant'});}
function render(){if(!perfil){chooseProfile();return;}$('#profile-switch').textContent=perfil.emoji+' '+perfil.nombre+' ▾';$$('[data-nav]').forEach(b=>b.classList.toggle('active',b.dataset.nav===page || (page==='carga' && b.dataset.nav==='inicio')));
  if(page==='inicio')app.innerHTML=renderHome();else if(page==='carga')app.innerHTML=renderFlow();else if(page==='movimientos')app.innerHTML=renderHistory();else if(page==='catalogo')app.innerHTML=renderCatalog();else if(page==='ajustes')app.innerHTML=renderSettings();else if(page==='transferencia')app.innerHTML=renderTransfer();else if(page==='deudas')app.innerHTML=renderDebt();
}
function renderHome(){const t=totalesMes(),balance=store.cuentas.reduce((s,c)=>s+saldoCuenta(c.id),0);const recent=[...store.movimientos].filter(m=>m.estado==='ACTIVO').reverse().slice(0,3);
return `<div class="eyebrow">TU ESPACIO FINANCIERO</div><h1 class="page-title">Todo bajo control.</h1><p class="sub muted" style="margin:0">Elegí una operación y registrala en pocos toques.</p><section class="hero"><div class="small">Saldo total de prueba</div><div class="amount">${money(balance)}</div><div class="hero-bottom"><div class="hero-stat"><span>↑ Ingresos del mes</span><b>${money(t.ing)}</b></div><div class="hero-stat"><span>↓ Gastos del mes</span><b>${money(t.gas)}</b></div></div></section>
<div class="quickgrid"><button class="quickbtn" data-action="start" data-type="GASTO"><span class="qi">↗</span><span>+ Gasto</span></button><button class="quickbtn" data-action="start" data-type="INGRESO"><span class="qi">↙</span><span>+ Ingreso</span></button><button class="quickbtn" data-action="transfer"><span class="qi">⇄</span><span>Transferir</span></button><button class="quickbtn" data-action="deudas"><span class="qi">◎</span><span>Deudas</span></button></div>
<div class="section-head"><h2>Mis cuentas</h2><button class="textbtn" data-action="new-account">+ Agregar</button></div><div class="account-row">${store.cuentas.length?store.cuentas.map(c=>`<div class="account"><div class="name">💳 ${html(c.nombre)}</div><div class="balance">${money(saldoCuenta(c.id))}</div></div>`).join(''):'<div class="empty">Todavía no tenés cuentas.</div>'}</div>
<div class="section-head"><h2>Últimos movimientos</h2><button class="textbtn" data-nav="movimientos">Ver historial →</button></div>${recent.length?recent.map(renderMovement).join(''):'<div class="empty">Todavía no registraste operaciones.<br>Probá agregando un gasto o ingreso de demostración.</div>'}
<div class="welcome">✨ <b>Tu catálogo se adapta a vos.</b> Las tarjetas más utilizadas suben al TOP 6. Las demás siguen disponibles en «Ver todos».</div>`;
}
function tileCategory(c){return `<button class="tile" data-action="choose-category" data-id="${html(c.id)}"><span class="symbol">${html(c.emoji||'📁')}</span><span class="tile-label">${html(c.nombre)}</span></button>`;}
function tileConcept(c){let count=frequency(c.id);return `<button class="tile" data-action="choose-concept" data-id="${html(c.id)}"><span class="symbol">${html(category(c.categoriaId)?.emoji||'•')}</span><span class="tile-label">${html(c.nombre)}</span>${count?`<span class="count">Usado ${count} ${count===1?'vez':'veces'}</span>`:''}</button>`;}
function renderFlow(){if(!flow)return '';const isGas=flow.tipo==='GASTO',subject=isGas?'Gasto':'Ingreso';let out=`<button class="back" data-action="flow-back">← Volver</button><div class="eyebrow">NUEVO ${subject.toUpperCase()}</div>`;
if(flow.etapa==='categoria') {let cats=rankedCats(flow.tipo);let visible=showAllCategories?cats:cats.slice(0,6);out+=`<h1 class="page-title">¿En qué categoría?</h1><p class="sub muted">Elegí una tarjeta. Las más usadas aparecen primero.</p><div class="three-grid">${visible.map(tileCategory).join('')}<button class="tile special" data-action="new-category" data-type="${flow.tipo}"><span class="symbol">＋</span><span class="tile-label">Nueva categoría</span></button></div>${cats.length>6?`<button class="all-link" data-action="toggle-categories">${showAllCategories?'Mostrar TOP 6':'Ver todas las categorías ('+cats.length+')'}</button>`:''}`;}
else if(flow.etapa==='concepto') {let cat=category(flow.categoriaId),items=rankedConcepts(cat.id);let results=searchTerm?items.filter(c=>c.nombre.toLowerCase().includes(searchTerm.toLowerCase())):(showAll?items:items.slice(0,6));out+=`<div class="step">${html(cat.emoji)} ${html(cat.nombre)} · Paso 2 de 3</div><h1 class="page-title">¿Qué ${isGas?'pagaste':'cobraste'}?</h1><div class="search"><input id="concept-search" type="search" placeholder="Buscar concepto..." value="${html(searchTerm)}" autocomplete="off"></div><div id="concept-results"><div class="two-grid">${results.map(tileConcept).join('')}${!searchTerm?`<button class="tile special" data-action="new-concept" data-id="${html(cat.id)}"><span class="symbol">＋</span><span class="tile-label">Nuevo concepto</span></button>`:''}</div>${results.length===0?'<div class="empty">No se encontraron conceptos.</div>':''}${!searchTerm&&items.length>6?`<button class="all-link" data-action="toggle-concepts">${showAll?'Mostrar TOP 6':'Ver todos los conceptos ('+items.length+')'}</button>`:''}</div>`;}
else {let cat=category(flow.categoriaId),con=concept(flow.conceptoId);out+=`<div class="step">${html(cat.nombre)} › ${html(con.nombre)} · Paso 3 de 3</div><h1 class="page-title">Importe y detalle</h1><div class="pills"><span class="pill">${html(cat.emoji)} ${html(cat.nombre)}</span><span class="pill">${html(con.nombre)}</span></div><form id="transaction-form" class="formcard"><div class="field"><label for="amount">Importe ($)</label><input class="bigamount" id="amount" name="amount" type="number" inputmode="decimal" min="0.01" step="0.01" placeholder="0" value="${con.importeSugerido??''}" required></div><div class="field"><label for="description">Descripción libre (opcional)</label><textarea id="description" name="description" placeholder="Ej.: Nafta para el auto, fotocopias, farmacia..."></textarea></div><div class="field"><label for="date">Fecha de la operación</label><input type="date" id="date" name="date" value="${today()}" required></div><div class="field"><label for="account">${isGas?'¿De qué cuenta sale?':'¿A qué cuenta ingresa?'}</label><select name="account" id="account" required>${store.cuentas.map(c=>`<option value="${html(c.id)}">${html(c.nombre)} · ${money(saldoCuenta(c.id))}</option>`).join('')}</select></div><p class="warn">🧪 Esto registra solamente una operación de prueba en este navegador. No se envía a Google Sheets.</p><button type="submit" class="primary">Registrar ${subject.toLowerCase()} de prueba</button></form>`;}
return out;}
function renderMovement(m){const isTransfer=m.tipo==='TRANSFERENCIA',isIncome=m.tipo==='INGRESO';let label=isTransfer?'Transferencia':m.conceptoNombre||'Movimiento';let details=isTransfer?`${html(account(m.cuentaId)?.nombre||'Cuenta')} → ${html(account(m.destinoId)?.nombre||'Cuenta')}`:`${html(m.categoriaNombre||m.tipo)} · ${html(account(m.cuentaId)?.nombre||'Cuenta')}`;return `<div class="mov"><div class="bubble">${isTransfer?'⇄':html(category(m.categoriaId)?.emoji||(isIncome?'💵':'🧾'))}</div><div class="detail"><strong>${html(label)}</strong><small>${details} · ${html(m.fecha)}</small>${m.descripcion?`<small style="display:block">${html(m.descripcion)}</small>`:''}</div><div class="money ${isIncome?'positive':'negative'}">${isIncome?'+':m.tipo==='GASTO'?'-':''}${money(m.importe)}</div></div>`;}
function renderHistory(){let all=[...store.movimientos].reverse();let active=all.filter(m=>movFilter==='TODOS'||m.estado===movFilter);return `<div class="eyebrow">TU HISTORIAL</div><h1 class="page-title">Movimientos</h1><p class="sub muted">Solo se muestran operaciones guardadas en este navegador.</p><div class="chips"><button class="chip ${movFilter==='TODOS'?'active':''}" data-action="filter-mov" data-id="TODOS">Todos</button><button class="chip ${movFilter==='ACTIVO'?'active':''}" data-action="filter-mov" data-id="ACTIVO">Activos</button><button class="chip ${movFilter==='ANULADO'?'active':''}" data-action="filter-mov" data-id="ANULADO">Anulados</button></div>${active.length?active.map(m=>`<div>${renderMovement(m)}<div style="display:flex;justify-content:flex-end;gap:10px;align-items:center;margin-top:-2px;padding-bottom:8px">${m.estado==='ACTIVO'?`<button class="textbtn" data-action="anular" data-id="${html(m.id)}">Anular prueba</button>`:'<span class="period">Anulado</span>'}</div></div>`).join(''):'<div class="empty">No hay movimientos para mostrar.</div>'}`;}
function renderCatalog(){let cats=[...store.categorias].filter(c=>c.activo!==false).sort((a,b)=>a.tipo.localeCompare(b.tipo)||a.orden-b.orden);return `<div class="eyebrow">TODO SE PUEDE PERSONALIZAR</div><h1 class="page-title">Mi catálogo</h1><p class="sub muted">Los conceptos iniciales vienen del archivo de datos. Los que agregues quedan en tu demo local.</p><div class="chips"><button class="secondary" data-action="new-category">＋ Categoría</button><button class="secondary" data-action="new-concept">＋ Concepto</button></div><div class="search"><input id="catalog-search" type="search" placeholder="Buscar categoría o concepto..." value="${html(catalogSearch)}"></div><div id="catalog-results">${catalogRows(cats)}</div>`;}
function catalogRows(cats){let term=catalogSearch.trim().toLowerCase();return cats.map(cat=>{let concepts=getConcepts(cat.id).filter(c=>!term||cat.nombre.toLowerCase().includes(term)||c.nombre.toLowerCase().includes(term));if(term&&!concepts.length&&!cat.nombre.toLowerCase().includes(term))return '';return `<div class="formcard" style="margin:12px 0"><div class="section-head" style="margin:0 0 8px"><h2 style="font-size:15px">${html(cat.emoji)} ${html(cat.nombre)} <span class="muted" style="font-size:11px">· ${cat.tipo==='GASTO'?'Gastos':'Ingresos'}</span></h2><button class="textbtn" data-action="new-concept" data-id="${html(cat.id)}">+ Agregar</button></div><div class="pills">${concepts.length?concepts.map(c=>`<span class="pill">${html(c.nombre)}</span>`).join(''):'<span class="note">Sin conceptos visibles</span>'}</div></div>`;}).join('')||'<div class="empty">Sin coincidencias.</div>';}
function renderSettings(){return `<div class="eyebrow">CONFIGURACIÓN DEMO</div><h1 class="page-title">A tu manera.</h1><div class="formcard"><b>Perfil actual</b><div class="listrow"><span style="font-size:28px">${html(perfil.emoji)}</span><div class="grow"><b>${html(perfil.nombre)}</b><div class="sub muted">${html(perfil.descripcion)}</div></div></div><button class="secondary" data-action="choose-profile">Cambiar perfil</button></div><div class="formcard"><b>Cuentas disponibles</b>${store.cuentas.map(c=>`<div class="listrow"><span>💳</span><div class="grow"><b>${html(c.nombre)}</b><div class="sub muted">Saldo inicial de prueba: ${money(c.saldoInicial||0)}</div></div></div>`).join('')}<button class="secondary" data-action="new-account" style="margin-top:13px">＋ Agregar cuenta</button></div><div class="formcard"><b>Sobre esta versión</b><p class="sub muted">Todo lo que registrás es una demostración, guardada en el navegador de este dispositivo. No hay usuarios, contraseñas, GAS ni Google Sheets conectados.</p><button class="secondary" data-action="reset-demo">Borrar datos de prueba de este perfil</button></div>`;}
function renderTransfer(){return `<button class="back" data-nav="inicio">← Inicio</button><div class="eyebrow">MOVER DINERO</div><h1 class="page-title">Transferir entre cuentas</h1><p class="sub muted">No cuenta como gasto ni ingreso; mueve un importe de una cuenta a otra.</p><form id="transfer-form" class="formcard"><div class="field"><label for="origin">Cuenta origen</label><select id="origin" name="origin" required>${store.cuentas.map(c=>`<option value="${html(c.id)}">${html(c.nombre)} · ${money(saldoCuenta(c.id))}</option>`).join('')}</select></div><div class="field"><label for="dest">Cuenta destino</label><select id="dest" name="dest" required>${store.cuentas.map((c,i)=>`<option value="${html(c.id)}" ${i===1?'selected':''}>${html(c.nombre)}</option>`).join('')}</select></div><div class="field"><label for="trans-amount">Importe ($)</label><input id="trans-amount" name="amount" type="number" inputmode="decimal" step="0.01" min="0.01" placeholder="0" required></div><div class="field"><label for="trans-date">Fecha</label><input id="trans-date" name="date" type="date" value="${today()}" required></div><div class="field"><label for="trans-description">Detalle (opcional)</label><input id="trans-description" name="description" placeholder="Ej.: efectivo al banco"></div><p class="warn">🧪 Transferencia de prueba. No mueve dinero real.</p><button type="submit" class="primary" ${store.cuentas.length<2?'disabled':''}>Registrar transferencia de prueba</button></form>${store.cuentas.length<2?'<p class="sub muted">Agregá otra cuenta para probar transferencias.</p>':''}`;}
function renderDebt(){return `<button class="back" data-nav="inicio">← Inicio</button><div class="eyebrow">PRÓXIMA ETAPA</div><h1 class="page-title">Deudas y cuotas</h1><div class="formcard"><div style="font-size:38px">🧾</div><h2 style="font-size:19px;margin-bottom:7px">Preparado para la segunda entrega</h2><p class="sub muted">Acá administraremos deudas que debés y dinero que te deben, pagos parciales y compromisos mensuales, sin duplicar gastos ni ingresos.</p><div class="info">Esta pantalla está identificada como pendiente para no simular que la función ya está desarrollada.</div></div><button class="primary" data-nav="inicio" style="margin-top:16px">Volver al inicio</button>`;}
function formNewCategory(tipo){openModal(modalTitle('Nueva categoría')+`<form id="category-form"><div class="field"><label>Nombre</label><input name="nombre" maxlength="35" placeholder="Ej.: Mascotas" required></div><div class="field"><label>Tipo</label><select name="tipo"><option value="GASTO" ${tipo==='GASTO'?'selected':''}>Gasto</option><option value="INGRESO" ${tipo==='INGRESO'?'selected':''}>Ingreso</option></select></div><div class="field"><label>Emoji (opcional)</label><input name="emoji" maxlength="8" placeholder="📦"></div><button class="primary" type="submit">Guardar categoría de prueba</button></form>`);}
function formNewConcept(cid){const cats=store.categorias.filter(c=>c.activo!==false),select=cats.map(c=>`<option value="${html(c.id)}" ${c.id===cid?'selected':''}>${html(c.nombre)} (${c.tipo})</option>`).join('');openModal(modalTitle('Nuevo concepto')+`<form id="concept-form"><div class="field"><label>Categoría</label><select name="categoriaId" required>${select}</select></div><div class="field"><label>Nombre</label><input name="nombre" maxlength="45" placeholder="Ej.: Estacionamiento" required></div><div class="field"><label>Importe sugerido (opcional)</label><input name="importe" type="number" inputmode="decimal" min="0" step="0.01" placeholder="Se podrá editar al registrar"></div><button class="primary" type="submit">Guardar concepto de prueba</button></form>`);}
function formNewAccount(){openModal(modalTitle('Nueva cuenta')+`<form id="account-form"><div class="field"><label>Nombre</label><input name="nombre" maxlength="40" placeholder="Ej.: Banco, efectivo, billetera" required></div><div class="field"><label>Tipo</label><select name="tipo"><option value="EFECTIVO">Efectivo</option><option value="BANCO">Banco</option><option value="BILLETERA">Billetera virtual</option><option value="OTRA">Otra</option></select></div><div class="field"><label>Saldo inicial de demostración</label><input name="saldo" type="number" inputmode="decimal" step="0.01" value="0" required></div><button class="primary" type="submit">Agregar cuenta de prueba</button></form>`);}
function toast(msg){const t=$('#toast');t.textContent=msg;t.classList.add('show');clearTimeout(toast.timer);toast.timer=setTimeout(()=>t.classList.remove('show'),3300);}
function confirmReset(){openModal(modalTitle('¿Borrar estos datos?')+`<p class="sub">Se eliminarán los movimientos y categorías creadas en la demo de <b>${html(perfil.nombre)}</b> en este navegador. Los demás perfiles no se borran.</p><button class="primary" data-action="confirm-reset">Sí, borrar datos de este perfil</button><button class="secondary" data-action="close-modal" style="width:100%;margin-top:10px">Cancelar</button>`);}
function confirmCancel(id){const m=store.movimientos.find(m=>m.id===id);if(!m||m.estado==='ANULADO')return;openModal(modalTitle('Anular movimiento')+`<p class="sub">Se marcará como <b>ANULADO</b> el movimiento de ${money(m.importe)} y dejará de contar en los saldos y el TOP.</p><div class="field"><label>Motivo (opcional)</label><input id="cancel-reason" placeholder="Ej.: carga equivocada"></div><button class="primary" data-action="confirm-anular" data-id="${html(id)}">Confirmar anulación de prueba</button>`);}
// Acciones delegadas: el HTML no contiene conceptos, categorías ni cuentas fijas.
document.addEventListener('click',ev=>{const el=ev.target.closest('[data-action],[data-nav]');if(!el)return;const d=el.dataset;
 if(d.nav){nav(d.nav);return;}
 switch(d.action){case 'select-profile':setProfile(d.id);break;case 'choose-profile':chooseProfile();break;case 'close-modal':hideModal();break;
 case 'start':flowStart(d.type);break;case 'choose-category':flow.categoriaId=d.id;flow.etapa='concepto';showAll=false;searchTerm='';render();break;
 case 'choose-concept':flow.conceptoId=d.id;flow.etapa='detalle';render();break;
 case 'flow-back':if(flow?.etapa==='detalle'){flow.etapa='concepto';render();}else if(flow?.etapa==='concepto'){flow.etapa='categoria';render();}else nav('inicio');break;
 case 'toggle-concepts':showAll=!showAll;render();break;case 'toggle-categories':showAllCategories=!showAllCategories;render();break;
 case 'new-category':formNewCategory(d.type);break;case 'new-concept':formNewConcept(d.id);break;case 'new-account':formNewAccount();break;
 case 'filter-mov':movFilter=d.id;render();break;case 'transfer':nav('transferencia');break;case 'deudas':nav('deudas');break;
 case 'reset-demo':confirmReset();break;case 'confirm-reset':localStorage.removeItem(storageKey(perfil.id));store=readProfile(perfil.id);persist();hideModal();nav('inicio');toast('Datos de prueba eliminados');break;
 case 'anular':confirmCancel(d.id);break;case 'confirm-anular':{let m=store.movimientos.find(m=>m.id===d.id);if(m&&m.estado==='ACTIVO'){m.estado='ANULADO';m.motivo=$('#cancel-reason')?.value.trim()||'';persist();hideModal();render();toast('Movimiento de prueba anulado');}break;}
 }
});
document.addEventListener('input',ev=>{
 if(ev.target.id==='concept-search'){searchTerm=ev.target.value;const at=$('#concept-results');let items=rankedConcepts(flow.categoriaId),results=items.filter(c=>c.nombre.toLowerCase().includes(searchTerm.toLowerCase()));at.innerHTML=`<div class="two-grid">${results.map(tileConcept).join('')}</div>${results.length?'':'<div class="empty">No se encontraron conceptos.</div>'}`;}
 if(ev.target.id==='catalog-search'){catalogSearch=ev.target.value;$('#catalog-results').innerHTML=catalogRows(store.categorias.filter(c=>c.activo!==false).sort((a,b)=>a.tipo.localeCompare(b.tipo)||a.orden-b.orden));}
});
document.addEventListener('submit',ev=>{
 const f=ev.target;const id=f.id;if(!['transaction-form','transfer-form','category-form','concept-form','account-form'].includes(id))return;ev.preventDefault();let fd=new FormData(f);
 if(id==='category-form'){let nombre=String(fd.get('nombre')||'').trim(),tipo=String(fd.get('tipo')),emoji=String(fd.get('emoji')||'').trim()||'📁';if(!nombre)return;if(store.categorias.some(c=>c.tipo===tipo&&c.nombre.toLowerCase()===nombre.toLowerCase())){toast('Esta categoría ya existe');return;}let cid='cat-'+uid();store.categorias.push({id:cid,nombre,tipo,emoji,orden:store.categorias.filter(c=>c.tipo===tipo).length+1,activo:true});persist();hideModal();if(page==='carga'&&flow?.etapa==='categoria'&&tipo===flow.tipo){flow.categoriaId=cid;flow.etapa='concepto';}render();toast('Categoría agregada a la demo');return;}
 if(id==='concept-form'){let nombre=String(fd.get('nombre')||'').trim(),catId=String(fd.get('categoriaId')),importe=String(fd.get('importe')||'').trim();if(!nombre||!category(catId))return;if(getConcepts(catId).some(c=>c.nombre.toLowerCase()===nombre.toLowerCase())){toast('El concepto ya existe en esa categoría');return;}let c={id:'con-'+uid(),categoriaId:catId,nombre,importeSugerido:importe?Number(importe):null,orden:getConcepts(catId).length+1,activo:true};store.conceptos.push(c);persist();hideModal();if(page==='carga'&&flow?.etapa==='concepto'&&flow.categoriaId===catId){flow.conceptoId=c.id;flow.etapa='detalle';}render();toast('Concepto agregado a la demo');return;}
 if(id==='account-form'){let nombre=String(fd.get('nombre')||'').trim(),saldo=Number(fd.get('saldo'));if(!nombre||!Number.isFinite(saldo))return;store.cuentas.push({id:'cta-'+uid(),nombre,tipo:String(fd.get('tipo')),saldoInicial:saldo});persist();hideModal();render();toast('Cuenta de prueba creada');return;}
 if(id==='transaction-form'){let importe=Number(fd.get('amount')),cuentaId=String(fd.get('account')),fecha=String(fd.get('date'));if(!Number.isFinite(importe)||importe<=0||!account(cuentaId)||!/^\d{4}-\d{2}-\d{2}$/.test(fecha)){toast('Revisá importe, fecha y cuenta');return;}let cat=category(flow.categoriaId),con=concept(flow.conceptoId);if(!cat||!con)return;f.querySelector('[type="submit"]').disabled=true;store.movimientos.push({id:uid(),opId:uid(),tipo:flow.tipo,fecha,registro:new Date().toISOString(),categoriaId:cat.id,categoriaNombre:cat.nombre,conceptoId:con.id,conceptoNombre:con.nombre,cuentaId,importe,descripcion:String(fd.get('description')||'').trim(),estado:'ACTIVO'});persist();nav('inicio');toast('¡Movimiento de prueba registrado!');return;}
 if(id==='transfer-form'){let origen=String(fd.get('origin')),destino=String(fd.get('dest')),importe=Number(fd.get('amount')),fecha=String(fd.get('date'));if(origen===destino){toast('Elegí dos cuentas diferentes');return;}if(!account(origen)||!account(destino)||!Number.isFinite(importe)||importe<=0||!/^\d{4}-\d{2}-\d{2}$/.test(fecha)){toast('Revisá los datos de la transferencia');return;}f.querySelector('[type="submit"]').disabled=true;store.movimientos.push({id:uid(),opId:uid(),tipo:'TRANSFERENCIA',fecha,registro:new Date().toISOString(),cuentaId:origen,destinoId:destino,importe,descripcion:String(fd.get('description')||'').trim(),estado:'ACTIVO'});persist();nav('inicio');toast('Transferencia de prueba registrada');}
});
$('#profile-switch').addEventListener('click',chooseProfile);
modal.addEventListener('click',ev=>{if(ev.target===modal)hideModal();});
(function init(){if(!CAT||!Array.isArray(CAT.perfiles)){app.innerHTML='<p>No se pudo cargar catalogo.js. Subí los dos archivos juntos.</p>';return;}let id=localStorage.getItem('vao_balance_demo_profile');if(id&&CAT.perfiles.some(p=>p.id===id)){perfil=CAT.perfiles.find(p=>p.id===id);store=readProfile(id);render();}else{app.innerHTML='<div class="eyebrow">BIENVENIDO</div><h1 class="page-title">Tus números, a tu manera.</h1><div class="welcome">Elegí con qué perfil querés conocer la aplicación. Podrás cambiarlo cuando quieras.</div><button class="primary" data-action="choose-profile" style="margin-top:20px">Elegir mi perfil</button>';chooseProfile();}})();
</script>
</body>
</html>
