<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>SEBA BALANCE · VAO Sistemas</title>
<link rel="icon" type="image/svg+xml" href="logo-se-isotipo.svg">
<style>
  :root{ --bg:#141A22; --panel:#1B2431; --panel-border:#2A3542; --text:#eef2f0; --muted:#90A0AF; --accent:#FF9800;
         --green:#2CCB6F; --green-hover:#34e07d; --green-active:#23b25e; --blue:#0078FF; --error:#e2665a; }
  *{ box-sizing:border-box; }
  html,body{ margin:0; padding:0; height:100%; overscroll-behavior-y:none; -webkit-tap-highlight-color:transparent; }
  body{ background:var(--bg); background-image:radial-gradient(ellipse at 50% -10%, rgba(0,120,255,0.10), transparent 55%), linear-gradient(180deg,#141A22 0%,#10151b 100%);
        color:var(--text); font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
        display:flex; align-items:center; justify-content:center; min-height:100vh; padding:24px; }
  .stage{ width:100%; max-width:360px; }
  .mark{ display:flex; justify-content:center; margin-bottom:20px; }
  .mark img{ height:64px; width:auto; max-width:100%; filter:drop-shadow(0 1px 3px rgba(0,0,0,0.3)); }
  .brand{ text-align:center; margin-bottom:32px; }
  .brand .company{ font-size:18px; font-weight:700; letter-spacing:0.06em; margin:0 0 8px; text-transform:uppercase; }
  .brand .tagline{ font-size:13px; color:var(--muted); margin:0 0 10px; line-height:1.4; }
  .brand .product{ font-size:12px; color:var(--muted); margin:0; opacity:0.8; }
  .panel{ background:var(--panel); border:1px solid var(--panel-border); border-top:2px solid var(--accent); border-radius:10px; padding:28px 22px 24px; }
  label{ display:block; font-size:14px; color:var(--muted); margin-bottom:10px; }
  input#codigo{ width:100%; font-size:22px; letter-spacing:0.12em; text-align:center; text-transform:uppercase; background:#10151b;
        border:1px solid var(--panel-border); border-radius:8px; color:var(--text); padding:16px 12px; outline:none; transition:border-color .15s; }
  input#codigo::placeholder{ text-transform:none; letter-spacing:normal; font-size:15px; color:#5c6b78; }
  input#codigo:focus{ border-color:var(--blue); box-shadow:0 0 0 3px rgba(0,120,255,0.20); }
  input#codigo.invalid{ border-color:var(--error); }
  .error-slot{ min-height:20px; margin-top:10px; } .error-slot p{ margin:0; font-size:13px; color:var(--error); }
  button#entrar{ width:100%; margin-top:18px; padding:15px 12px; font-size:16px; font-weight:600; color:#0c1a12; background:var(--green);
        border:none; border-radius:8px; cursor:pointer; }
  button#entrar:active{ background:var(--green-active); transform:translateY(1px); }
  .admin-row{ text-align:center; margin-top:26px; } .admin-row span{ color:var(--muted); font-size:13px; }
  a.admin-link{ color:var(--muted); font-size:13px; text-decoration:underline; text-underline-offset:2px; }
  .version-tag{ position:fixed; right:10px; bottom:8px; font-size:11px; color:#3a4652; }
  .aviso-cfg{ background:#3a2a10; border:1px solid #7a5a20; color:#ffcc80; border-radius:8px; padding:10px 12px; font-size:13px; margin-bottom:14px; display:none; }
</style>
</head>
<body>
  <div class="stage">
    <div class="mark"><img src="logo-se.svg" alt="SE" onerror="this.style.display='none'"></div>
    <div class="brand">
      <p class="company">SEBA BALANCE</p>
      <p class="tagline">Tus gastos e ingresos, como una boleta.</p>
      <p class="product">VAO Sistemas</p>
    </div>
    <div class="panel">
      <div class="aviso-cfg" id="avisoCfg">⚠️ Falta configurar la dirección del servidor en <b>seba-config.js</b>.</div>
      <form id="form-entrada" novalidate>
        <label for="codigo">Ingresá tu código de cliente (ej: XX)</label>
        <input type="text" id="codigo" name="codigo" maxlength="3" autocomplete="off" autocapitalize="characters" spellcheck="false" placeholder="XX">
        <div class="error-slot" aria-live="polite"><p id="error-msg" hidden>Código inválido (2 o 3 letras)</p></div>
        <button type="submit" id="entrar">Entrar</button>
      </form>
    </div>
    <div class="admin-row"><span>¿Sos administrador?</span> <a class="admin-link" href="admin.html">Acceso aquí</a></div>
  </div>
  <span class="version-tag" id="version-tag"></span>
<script src="seba-config.js"></script>
<script src="seba-comun.js"></script>
<script>
  window.APP_VERSION = 3;
  document.getElementById('version-tag').textContent = 'v' + APP_VERSION;
  if (!SEBA.configurado) document.getElementById('avisoCfg').style.display = 'block';
  const form = document.getElementById('form-entrada'), input = document.getElementById('codigo'), errorMsg = document.getElementById('error-msg');
  try { const ult = localStorage.getItem('seba_ultimo_prefijo'); if (ult) input.value = ult; } catch (e) {}
  function mostrarError(m) { errorMsg.hidden = !m; input.classList.toggle('invalid', m); }
  form.addEventListener('submit', function (e) {
    e.preventDefault();
    const v = input.value.trim();
    if (!/^[A-Za-z]{2,3}$/.test(v)) { mostrarError(true); input.focus(); return; }
    mostrarError(false);
    try { localStorage.setItem('seba_ultimo_prefijo', v.toUpperCase()); } catch (e) {}
    window.location.href = 'balance.html?p=' + v.toUpperCase();
  });
  input.addEventListener('input', function () { if (!errorMsg.hidden) mostrarError(false); });
</script>
</body>
</html>
